name: CI/CD Pipeline

on: 
  push:
    branches: [main]
  workflow dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Project code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt
      
      - name: ML Model Training
        run: python train.py

      - name: ML Model Testing
        run: python test.py

      - name: Deployment
        if: success() && github.ref == 'refs/heads/main'
        env: 
          RENDER_DEPLOY_HOOK: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
        curl --fail --silent --show-error '$RENDER_DEPLOY_HOOK' 